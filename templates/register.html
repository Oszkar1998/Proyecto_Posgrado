<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/index.css') }}">
    
    <style>
        .permissions-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(214, 187, 31, 0.25);
            border-radius: 14px;
            padding: 14px 16px;
            margin-top: 18px;
            margin-bottom: 18px;
            color: white;
            text-align: left;
        }

        .permissions-box p {
            margin-top: 0;
            margin-bottom: 12px;
            color: #ffffff;
            font-weight: 500;
            font-size: 14px;
        }

        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(180px, 1fr));
            column-gap: 70px;
            row-gap: 14px;
            margin-top: 10px;
        }

        .permissions-grid label {
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1;
            margin: 0;
            padding: 4px 0;
            color: #ffffff;
            cursor: pointer;
        }

        .permissions-grid input[type="checkbox"],
        .admin-box input[type="checkbox"] {
            width: 16px;
            height: 16px;
            padding: 0;
            margin: 0;
            flex: 0 0 auto;
            accent-color: #d6bb1f;
            cursor: pointer;
        }

        .admin-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(214, 187, 31, 0.25);
            border-radius: 14px;
            padding: 12px 16px;
            margin-top: 20px;
            margin-bottom: 18px;
            color: white;
            text-align: left;
        }

        .admin-box label {
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.3;
            font-size: 15px;
            color: #ffffff;
            cursor: pointer;
        }

        form button[type="submit"] {
            margin-top: 22px;
        }
    </style>

    <script>
        function togglePermissions() {
            const isAdmin = document.getElementById("is_admin").checked;
            const permissions = document.querySelectorAll("input[name='permissions']");
            const section = document.getElementById("permissions_section");

            section.style.display = isAdmin ? "none" : "block";

            permissions.forEach(p => {
                p.checked = false;
                p.disabled = isAdmin;
            });
        }
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/toast.css') }}">
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/spinner.css') }}">
    <script src="{{ url_for('static', filename='js/spinner.js') }}"></script>
</head>
<body>
    <header class="header-login">
        <img src="{{ url_for('static', filename='Imagenes/Logo.PNG') }}" alt="Logo UNAM">
    </header>

    <div class="auth-box" style="width: 600px; max-width: 95%;">
        <div class="form-container">
            <h2>👤 Crear usuario</h2>

            <form method="POST" action="{{ url_for('register') }}">
                <input type="email" name="email" placeholder="Correo electrónico" required>
                <input type="password" name="password" placeholder="Contraseña" required>

                <div class="admin-box">
                    <label>
                        <input type="checkbox" id="is_admin" name="is_admin" value="1" onchange="togglePermissions()">
                        Este usuario será administrador y tendrá todos los privilegios
                    </label>
                </div>

                <div id="permissions_section" class="permissions-box">
                    <p>Selecciona los permisos que tendrá este usuario:</p>
                    <div class="permissions-grid">
                        {% for permission in permissions %}
                            <label>
                                <input type="checkbox" name="permissions" value="{{ permission['name'] }}">
                                {{ permission['name'] }}
                            </label>
                        {% endfor %}
                    </div>
                </div>

                <button type="submit" style="margin-top: 20px;">Crear usuario</button>
            </form>

            <p><a href="{{ url_for('home') }}">Volver al menú principal</a></p>
        </div>
    </div>

    {% if error %}
    <p class="mensaje-error">{{ error }}</p>
    {% endif %}

    {% if message %}
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            toast.ok("{{ message }}");
        });
    </script>
    {% endif %}
</body>
</html>
