<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisión — Posgrado FI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/revision.css') }}">
    <script src="{{ url_for('static', filename='js/revision.js') }}" defer></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/toast.css') }}">
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/spinner.css') }}">
    <script src="{{ url_for('static', filename='js/spinner.js') }}"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Estilo común: va al final para que mande sobre el CSS del módulo -->
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/base.css') }}">
</head>

<body>
    <!-- Barra superior -->
    <header class="topbar">
        <nav id="regresar-PagPrincipal" aria-label="Ubicación">
            <a href="/home" class="migas-inicio"><i class="fa-solid fa-house"></i> Menú principal</a>
            <span class="migas-sep" aria-hidden="true">›</span>
            <span class="migas-actual">Revisión</span>
        </nav>

        <div class="top-actions">
            <button id="contador-container" type="button" onclick="mostrarModalContador()">
                <i class="fa-solid fa-scroll"></i> NÚMERO DE OFICIO: <span id="contador-valor">0</span>
            </button>

            <button id="coordinador-container" type="button" onclick="mostrarModalCoordinador()">
                <i class="fa-solid fa-person-chalkboard"></i> COORDINADOR
            </button>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="container">
        <section class="card">
            <h1><i class="fa-solid fa-scroll"></i> Revisión · Oficio de Revisión</h1>
            <p class="descripcion">Ingrese el número de cuenta del alumno o alumna (9 dígitos).</p>

            <form id="searchForm" method="POST" autocomplete="off">
                <div class="input-group">
                    <label for="numDeCuenta">Número de Cuenta</label>
                    <input
                        type="text"
                        id="numDeCuenta"
                        name="numDeCuenta"
                        placeholder="Ejemplo: 123456789"
                        maxlength="9"
                        inputmode="numeric"
                        pattern="[0-9]{9}"
                        required
                    >
                </div>
            </form>
        </section>

        <p id="hint" class="hint-text">
            Escribe tu número de cuenta (9 dígitos). Validaremos automáticamente.
        </p>
    </main>

    <!-- Modal contador -->
    <div class="modal-contador" id="modal-contador">
        <div class="modal-content2">
            <h2>Actualizar Contador</h2>
            <input type="number" id="nuevoContador" min="1" required>
            <div class="modal-actions">
                <button type="button" onclick="actualizarContador()">
                    <i class="fa-solid fa-check"></i> Guardar
                </button>
                <button type="button" onclick="cerrarModalContador()">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal coordinador -->
    <div class="modal-coordinador" id="modal-coordinador">
        <div class="modal-content3">
            <h2>Actualizar Coordinador</h2>
            <input type="text" id="nombreCoordinador" placeholder="Nombre completo">
            <select id="sexoCoordinador">
                <option value="">Selecciona el sexo</option>
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
            </select>
            <div class="modal-actions">
                <button type="button" onclick="actualizarCoordinador()">
                    <i class="fa-solid fa-check"></i> Guardar
                </button>
                <button type="button" onclick="cerrarModalCoordinador()">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal selección de plan -->
    <div id="modalSeleccionPlan" class="modal">
        <div class="modal-content">
            <h2>Selecciona el plan para generar documentos</h2>
            <p id="resumenProgramas" class="modal-resumen"></p>
            <div id="opcionesPlanes"></div>
            <div class="modal-actions">
                <button type="button" class="btn cancel" onclick="cerrarModalSeleccion()">
                    <i class="fa-solid fa-xmark"></i> Cerrar
                </button>
            </div>
        </div>
    </div>

</body>
</html>
