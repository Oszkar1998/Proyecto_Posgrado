<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGAE Grado</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/dgaeGrado.css') }}" />
    <script src="{{ url_for('static', filename='js/dgaeGrado.js') }}" defer></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/toast.css') }}">
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/spinner.css') }}">
    <script src="{{ url_for('static', filename='js/spinner.js') }}"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <!-- Barra superior -->
    <header class="topbar">
        <div id="regresar-PagPrincipal" onclick="window.location.href='/home'">
            <span><i class="fa-solid fa-house"></i> Menú Principal</span>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="container">
        <section class="card">
            <h1><i class="fa-solid fa-file-lines"></i> Consulta de Documentos de DGAE Grado</h1>
            <p class="descripcion">Ingrese el número de cuenta para validar y generar el formato correspondiente.</p>

            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <label for="numeroDeCuenta">Número de Cuenta</label>
                    <input
                        id="numeroDeCuenta"
                        name="numeroDeCuenta"
                        type="text"
                        placeholder="Ejemplo: 123456789"
                        maxlength="9"
                        inputmode="numeric"
                        pattern="[0-9]{9}"
                        required
                    />
                </div>

                <div id="estado-validacion" class="estado-validacion info">
                    Escribe tu número de cuenta.
                </div>
            </form>

            <div id="botones-expediente" class="botones-expediente">
                <button id="btn-documento-1" type="button">PRESENCIAL</button>
                <button id="btn-documento-2" type="button">VIRTUAL</button>
            </div>

            <div id="botones-opciones-virtual" class="botones-opciones-virtual">
                <button id="btn-virtual-todas-x" type="button">TODAS LAS X</button>
                <button id="btn-virtual-mencion" type="button">SIN MENCIÓN HONORÍFICA</button>
                <button id="btn-virtual-medalla" type="button">SIN MEDALLA ALFONSO CASO</button>
                <button id="btn-virtual-ninguna" type="button">SIN MENCIÓN Y MEDALLA</button>
            </div>

            <div id="botones-opciones-presencial" class="botones-opciones-presencial">
                <button id="btn-presencial-todas-x" type="button">TODAS LAS X</button>
                <button id="btn-presencial-mencion" type="button">SIN MENCIÓN HONORÍFICA</button>
                <button id="btn-presencial-medalla" type="button">SIN MEDALLA ALFONSO CASO</button>
                <button id="btn-presencial-ninguna" type="button">SIN MENCIÓN Y MEDALLA</button>
            </div>
        </section>
    </main>
</body>
</html>
