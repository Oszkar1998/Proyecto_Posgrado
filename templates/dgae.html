<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posgrado | DGAE</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/dgae.css') }}" />
    <script src="{{ url_for('static', filename='js/dgae.js') }}" defer></script>
</head>

<body>
    <!-- Barra superior -->
    <header class="topbar">
        <div id="regresar-PagPrincipal" onclick="window.location.href='/home'">
            <span>🏠 Menú Principal </span>
        </div>
    </header>

    <div id="modalSeleccionPlan" class="modal">
        <div class="modal-content">
            <h2>Selecciona el plan para generar DGAE</h2>
            <p id="resumenProgramas"></p>
            <div id="opcionesPlanes" class="opciones-planes"></div>
            <button type="button" onclick="cerrarModalSeleccion()">Cerrar</button>
        </div>
    </div>

    <!-- Contenido principal -->
    <main class="container">
        <section class="card">
            <h1>Consulta de Documentos DGAE</h1>
            <p class="descripcion">Ingrese el número de cuenta para validar y generar los documentos correspondientes.</p>

            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <label for="numeroDeCuenta">Número de Cuenta</label>
                    <input
                        type="text"
                        id="numeroDeCuenta"
                        name="numeroDeCuenta"
                        placeholder="Ejemplo: 123456789"
                        maxlength="9"
                        inputmode="numeric"
                        pattern="[0-9]{9}"
                        required
                    />
                </div>

                <div id="estado-validacion" class="estado-validacion">
                    Escribe tu número (9 dígitos). Validaremos automáticamente.
                </div>
            </form>

            <div id="botones-expediente" class="botones-expediente">
                <button id="btn-documento-1" type="button">UNAM</button>

                <button id="btn-documento-2" type="button">NO UNAM</button>

                <div id="botones-opciones-doc2" class="botones-opciones-doc2">
                    <button id="btn-doc2-sinX" type="button">Documentos sin X</button>
                    <button id="btn-doc2-conX" type="button">Documentos con X</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
