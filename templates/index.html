<!DOCTYPE html>
<html lang="es">
<head>    
    <!-- 👉 Este evita que el navegador use páginas del caché -->                               
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>

    
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/index.css') }}">
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>

    
    <!-- 👉 Este script fuerza recarga si se vuelve con la flecha -->
    <script>
        window.onpageshow = function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        };
    </script>

</head>

<body>

    <header class="header-login">
        <img src="{{ url_for('static', filename='Imagenes/Logo.PNG') }}" alt="Logo UNAM Posgrado">
    </header>

    <div class="auth-box">
        <div class="form-container login-container" id="login">
            <h2>🔐 Iniciar Sesión</h2>
            <p class="login-subtitle">Acceso para personal autorizado</p>

            {% if error %}
            <div class="mensaje-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('index') }}">
                <input type="email" name="email" placeholder="Correo electrónico" required>

                <div class="password-wrapper">
                    <input type="password" name="password" id="password" placeholder="Contraseña" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">Ver</button>
                </div>

                <button type="submit">Ingresar</button>
            </form>
        </div>
    </div>
    
    {% if message %}
    <script>
        alert("{{ message }}");
    </script>
    {% endif %}
</body>
</html>
