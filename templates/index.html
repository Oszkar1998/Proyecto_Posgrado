<!DOCTYPE html>
<html lang="es">
<head>    
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Posgrado FI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/index.css') }}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>

    <script>
        window.onpageshow = function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        };
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/toast.css') }}">
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos/spinner.css') }}">
    <script src="{{ url_for('static', filename='js/spinner.js') }}"></script>
</head>

<body>

    <header class="header-login">
        <img src="{{ url_for('static', filename='Imagenes/Logo.PNG') }}" alt="Logo UNAM Posgrado">
    </header>

    <div class="auth-box">
        <div class="form-container login-container" id="login">

            <div class="login-icon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h2>Iniciar Sesión</h2>
            <p class="login-subtitle">Acceso para personal autorizado</p>

            {% if error %}
            <div class="mensaje-error">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('index') }}">

                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" name="email" placeholder="Correo electrónico" required>
                </div>

                <div class="input-wrapper password-wrapper">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input type="password" name="password" id="password" placeholder="Contraseña" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-right-to-bracket"></i> Ingresar
                </button>

            </form>
        </div>
    </div>

    {% if message %}
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            toast.ok("{{ message }}");
        });
    </script>
    {% endif %}

</body>
</html>
